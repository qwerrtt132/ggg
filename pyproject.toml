[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
version = "0.3.0"
description = "Teams of model-backed agents that message each other toward a goal, with a local web app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
ui-tests = ["playwright>=1.40"]

[project.scripts]
agent-team = "agent_team.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_team*"]

[tool.setuptools.package-data]
agent_team = ["static/*", "default_team.json"]
