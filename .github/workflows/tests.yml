name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the browser test dependencies
        run: python -m pip install ".[ui-tests]"

      - name: Install Chromium for the browser tests
        run: |
          python -m playwright install --with-deps chromium
          python - >> "$GITHUB_ENV" <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"AGENT_TEAM_CHROME={p.chromium.executable_path}")
          PY

      - name: Run the tests, failing if any test was skipped
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          if grep -q "skipped" test-output.txt; then
            echo "Some tests were skipped. The browser tests must run in CI." >&2
            exit 1
          fi
